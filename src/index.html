<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="A simple Todo List application created for an Advanced Git and DevOps assignment">

    <title>Todo List Application</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main Application Container -->
    <main class="todo-container">

        <!-- Application Header -->
        <header class="todo-header">
            <h1>My Todo List</h1>
            <p>Organize your tasks and stay productive</p>
        </header>


        <!-- Add Task Section -->
        <section class="add-task-section">

            <label for="taskInput" class="sr-only">
                Enter a new task
            </label>

            <input type="text" id="taskInput" placeholder="Enter a new task..." maxlength="100" autocomplete="off">

            <button id="addTaskBtn" type="button">
                Add Task
            </button>

        </section>


        <!-- Task Statistics -->
        <section class="task-stats">

            <div class="stat">
                <span id="totalTasks">0</span>
                <small>Total</small>
            </div>

            <div class="stat">
                <span id="activeTasks">0</span>
                <small>Active</small>
            </div>

            <div class="stat">
                <span id="completedTasks">0</span>
                <small>Completed</small>
            </div>

        </section>


        <!-- Task Filter Section -->
        <nav class="filter-section" aria-label="Task filters">

            <button class="filter-btn active" data-filter="all" type="button">
                All
            </button>

            <button class="filter-btn" data-filter="active" type="button">
                Active
            </button>

            <button class="filter-btn" data-filter="completed" type="button">
                Completed
            </button>

        </nav>


        <!-- Task List -->
        <section class="tasks-section">

            <h2 class="section-title">Tasks</h2>

            <ul id="taskList" class="task-list">
                <!-- Tasks will be added here using JavaScript -->
            </ul>

            <!-- Empty Task Message -->
            <div id="emptyMessage" class="empty-message">
                <p>No tasks yet.</p>
                <p>Add your first task above!</p>
            </div>

        </section>


        <!-- Task Footer -->
        <footer class="todo-footer">

            <p>
                <span id="taskCounter">0</span>
                tasks remaining
            </p>

            <button id="clearCompletedBtn" type="button">
                Clear Completed
            </button>

        </footer>

    </main>


    <!-- JavaScript -->
    <script src="scripts/app.js"></script>

</body>

</html>
